<div id="lb"></div>
<div id="hud"><span><i class="cn"></i> <b id="co">0</b></span><span class="sp">📅 День <b id="dy">1</b> <i class="bar"><i id="db"></i></i></span><button id="bm">🧪 Лаборатория</button><button id="bb">📖 Сборник</button><button id="bs">🛒 Магазин</button><button id="bk">📈 Рынок</button><button id="bh">❓ Подсказки</button><button id="bl">🏆 Лидеры</button><button id="bv">⏩ ×1</button><button id="bg">⚙️ Настройки</button></div>

<div id="md" hidden><div id="mb"></div></div>
<script>
const C=document.getElementById('c'),X=C.getContext('2d'),W=1100,H=680,T=80,CO=9,RO=6,FX=30,FY=100,DAY=240,M='💰';
const rr=(a,b)=>a+Math.random()*(b-a),wrap=a=>{while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;return a},cl=(v,a,b)=>Math.min(b,Math.max(a,v));
const Q={A:[6,.55,.35,.12,0],B:[0,0,0,0,.45],C:[10,.72,.38,.15,.36],D:[0,0,0,0,.8],E:[5,.6,.24,.24,0],F:[8,.6,.5,.12,.2],G:[3,.45,.3,.3,0],H:[2,.5,.55,.18,0],I:[0,0,0,0,.55],J:[7,.65,.16,.16,.25]};
// имя, оттенок, насыщ., светл., время роста с, цена, порог открытия (заработано), форма, начало гибрида, конец гибрида
const SP=[
['Пшеница',45,80,55,30,3,0,'A','Пше','ница'],['Морковь',28,90,52,40,4,0,'B','Мор','ковь'],['Подсолнух',50,95,55,55,7,30,'C','Подсол','нух'],['Тыква',25,90,50,70,10,80,'D','Ты','ква'],
['Клубника',345,80,50,50,8,150,'E','Клуб','ника'],['Лунный цветок',225,90,78,90,40,-1,'F','Лун','цвет'],
['Картофель',35,45,60,60,6,100,'I','Карто','фель'],['Малина',340,75,50,55,9,180,'J','Ма','лина'],['Помидор',5,80,50,65,8,250,'I','Поми','дор'],['Огурец',110,60,40,45,6,300,'H','Огур','ец'],
['Кукуруза',50,90,55,75,8,380,'A','Куку','руза'],['Капуста',100,45,65,80,9,450,'D','Ка','пуста'],['Лук',40,60,70,50,5,500,'B','Лу','ковица'],['Чеснок',30,20,90,55,7,560,'B','Чес','нок'],
['Свёкла',335,65,35,60,6,650,'I','Свё','кла'],['Редис',350,75,55,30,4,720,'B','Ре','дис'],['Перец',0,85,45,70,10,800,'H','Пе','рец'],['Баклажан',280,50,30,75,11,900,'H','Бак','лажан'],
['Арбуз',120,50,40,100,18,1100,'D','Ар','буз'],['Дыня',48,70,65,95,17,1250,'D','Ды','ня'],['Черника',230,50,35,55,11,1400,'E','Чер','ника'],['Горох',95,55,50,40,5,1550,'G','Го','рох'],
['Фасоль',20,40,45,50,6,1700,'H','Фа','соль'],['Салат',105,60,60,30,4,1850,'D','Са','лат'],['Шпинат',125,55,35,30,5,2000,'D','Шпи','нат'],['Виноград',285,45,40,90,20,2200,'G','Вино','град'],
['Кабачок',85,45,55,60,8,2400,'H','Каба','чок'],['Роза',350,80,55,85,22,2700,'C','Ро','за']
].map(r=>({n:r[0],h:r[1],s:r[2],l:r[3],t:r[4],v:r[5],u:r[6],q:Q[r[7]],pr:r[8],sf:r[9]}));SP[2].cc='#5a3a1a';SP[5].cc='#fff';
const MU={giant:['Гигантизм',2,'крупнее, цена ×2'],glow:['Свечение',2,'светится, цена ×2'],gold:['Золотой',3,'цена ×3'],stripe:['Полосатый',1.5,'полоски, цена ×1.5'],fast:['Быстророст',1.3,'растёт на 50% быстрее, цена ×1.3'],rain:['Радужный',4,'переливается, цена ×4']};
let S={coins:25,earn:0,seeds:[],disc:{},mu:{},tiles:[],day:1,tod:0,mk:[],hyb:{},mult:1,spd:1,glue:1,up:{},name:'',best:0},mode='farm',tm=0,px=0,py=0,held=null,hov=null,parts=[],fls=[],SLT=[null,null];
try{const j=JSON.parse(localStorage.getItem('farm2')||localStorage.getItem('farm1'));if(j&&j.tiles&&j.tiles.length)S=Object.assign(S,j)}catch(e){}
if(!S.tiles.length)for(let i=0;i<CO*RO;i++)S.tiles.push({till:0,hole:0,wet:0,ps:[]});
S.tiles.forEach(t=>{if(!t.ps)t.ps=t.p?[t.p]:[];delete t.p});
function rollMk(){S.mk=SP.map(()=>{const r=Math.random();return +(r<.18?rr(1.4,2):r<.36?rr(.5,.75):rr(.9,1.1)).toFixed(2)})}
if(S.mk.length!=SP.length)rollMk();
const nm=g=>g.x!=null?SP[g.sp].pr+SP[g.x].sf:SP[g.sp].n,sid=g=>g.sp+'-'+(g.x??''),key=g=>[sid(g),g.h|0,g.z.toFixed(2),g.r.toFixed(2),g.y.toFixed(1),g.m.join()].join('|');
const base=g=>g.x!=null?(SP[g.sp].v+SP[g.x].v)/2*1.3:SP[g.sp].v,mkc=g=>g.x!=null?(S.mk[g.sp]+S.mk[g.x])/2:S.mk[g.sp];
const val=g=>S.mult*base(g)*mkc(g)*g.z*g.m.reduce((a,k)=>a*MU[k][1],1),need=g=>(g.x!=null?(SP[g.sp].t+SP[g.x].t)/2:SP[g.sp].t)/(g.r*(g.m.includes('fast')?1.5:1));
function mk(k,hx,hy,L,e){return Object.assign({k,hx,hy,x:hx,y:hy,vx:0,vy:0,a:0,h:0,L,cd:0,tm:0},e)}
const TF=[mk('hoe',815,130,85),mk('shovel',815,190,80),mk('can',940,130,70),mk('sickle',940,190,60)],TLb=[mk('vial',50,570,50),mk('pip',50,625,55)];let PK=[];
function sync(){S.seeds=S.seeds.filter(s=>s.n>0||PK.some(t=>t.s===s&&t.h));const old=PK;PK=S.seeds.map(s=>old.find(t=>t.s===s)||mk('pk',0,0,38,{s}));PK.forEach((t,i)=>{t.hx=805+(i%3)*95;t.hy=290+Math.min(6,(i/3)|0)*46})}
const qz=g=>({sp:g.sp,x:g.x,h:Math.round(g.h/10)*10,z:Math.round(g.z*10)/10,r:Math.round(g.r*10)/10,y:Math.round(g.y*2)/2,m:[...g.m].sort()});
const sk=g=>sid(g)+'|'+[...g.m].sort().join();
function addSeed(g,n){g=qz(g);const k=sk(g);let s=S.seeds.find(q=>sk(q)===k);if(s){const t=s.n+n;if(t>0)['h','z','r','y'].forEach(f=>s[f]=(s[f]*Math.max(0,s.n)+g[f]*n)/t);s.n=t}else S.seeds.push({...g,n});S.disc[g.sp]=1;if(g.x!=null){S.disc[g.x]=1;S.hyb[g.sp+'-'+g.x]=1}g.m.forEach(m=>S.mu[m]=1);sync()}
if(!S.seeds.length){addSeed({sp:0,h:0,z:1,r:1,y:1,m:[]},10);addSeed({sp:1,h:0,z:1,r:1,y:1,m:[]},6)}
S.seeds.forEach(s=>S.disc[s.sp]=1);{const o=S.seeds;S.seeds=[];o.forEach(s=>addSeed(s,s.n))}sync();
const tools=()=>mode=='farm'?[...TF,...PK]:TLb,tipOf=t=>[t.x+Math.cos(t.a)*t.L,t.y+Math.sin(t.a)*t.L];
const tileAt=(x,y)=>{const ix=Math.floor((x-FX)/T),iy=Math.floor((y-FY)/T);return ix>=0&&iy>=0&&ix<CO&&iy<RO?S.tiles[iy*CO+ix]:null};
const fl=(x,y,s,c)=>fls.push({x,y,t:1.8,s,c:c||'#ffe27a'});
function burst(x,y,col){for(let i=0;i<2;i++)parts.push({k:'d',x,y,vx:rr(-60,60),vy:rr(-90,-10),l:.4,L:.4,col})}
function mut(g,x,y){const dr=Math.random()<.15?1:0,c={sp:g.sp,x:g.x,h:g.h+dr*rr(-10,10),z:cl(g.z+dr*rr(-.1,.1),.7,1.8),r:cl(g.r+dr*rr(-.1,.1),.7,2),y:cl(g.y+dr*rr(-.5,.5),1,4),m:[...g.m]};
 if(Math.random()<.1){const f=Object.keys(MU).filter(k=>!c.m.includes(k));if(f.length){const k=f[Math.random()*f.length|0];c.m.push(k);fl(x,y-20,'Мутация: '+MU[k][0],'#9f9')}}return c}
function harvest(tl,p,x,y){const g=p.g,c=Math.round(val(g));S.coins+=c;S.earn+=c;fl(x,y-10,'+'+c+M);addSeed(g,Math.max(1,Math.round(g.y)));tl.ps=tl.ps.filter(q=>q!==p);if(!tl.ps.length){tl.hole=0;tl.till=0;tl.wet=0}for(let i=0;i<8;i++)burst(x,y,'#7bd35a')}
function phys(t,dt){if(t.h&&(S.glue||t.k=='pk')){const gx=px-Math.cos(2.4)*t.L,gy=py-Math.sin(2.4)*t.L;t.vx+=((gx-t.x)*500-t.vx*34)*dt;t.vy+=((gy-t.y)*500-t.vy*34)*dt;t.a+=wrap(2.4-t.a)*Math.min(1,dt*14)}
 else if(t.h){t.vx+=((px-t.x)*160-t.vx*15)*dt;t.vy+=((py-t.y)*160-t.vy*15)*dt;if(Math.hypot(t.vx,t.vy)>40)t.a+=wrap(Math.atan2(-t.vy,-t.vx)-t.a)*Math.min(1,dt*7)}
 else if(t.lay){t.vy+=1400*dt;t.vx*=Math.pow(.02,dt);t.a+=wrap(t.la-t.a)*Math.min(1,dt*5)}
 else{t.vx+=((t.hx-t.x)*70-t.vx*11)*dt;t.vy+=((t.hy-t.y)*70-t.vy*11)*dt;t.a+=wrap(-t.a)*Math.min(1,dt*6)}t.x+=t.vx*dt;t.y+=t.vy*dt;if(t.lay&&!t.h){t.x=cl(t.x,40,700);if(t.y>t.gy){t.y=t.gy;t.vy=Math.abs(t.vy)>120?-t.vy*.3:0}}}
function act(t,dt){const[tx,ty]=tipOf(t),tl=tileAt(tx,ty),sp=Math.hypot(t.vx,t.vy),mv=sp>35;
 if(t.k=='hoe'&&mv)(S.up.hoe?ar(tx,ty,S.up.hoe2?125:66):tl?[tl]:[]).forEach(q=>{if(!q.ps.length&&!q.hole&&q.till<1){q.till=Math.min(1,q.till+dt*(S.up.hoe2?10:S.up.hoe?4:1.6));burst(tx,ty,'#6b4423')}});
 if(t.k=='shovel'&&mv)(S.up.shovel?ar(tx,ty,66):tl?[tl]:[]).forEach(q=>{if(!q.ps.length&&q.till>=1&&q.hole<1){q.hole=Math.min(1,q.hole+dt*(S.up.shovel?4:1.4));burst(tx,ty,'#4a2d14')}});
 if(t.k=='can'){t.tm-=dt;if(t.tm<=0){t.tm=.04;parts.push({k:'w',x:tx+rr(-4,4),y:ty,vx:rr(-15,15),vy:rr(20,50),l:.3,L:.3})}if(tl&&tl.till>=1)tl.wet=Math.min(1,tl.wet+dt*1.2)}
 if(t.k=='sickle'&&mv)(S.up.sickle?ar(tx,ty,80):tl?[tl]:[]).forEach(q=>q.ps.filter(p=>p.age>=need(p.g)).forEach(p=>harvest(q,p,tx,ty)));
 }
function update(dt){tools().forEach(t=>phys(t,dt));
 S.tod+=dt*S.spd;if(S.tod>=DAY){S.tod-=DAY;S.day++;rollMk();fl(550,330,'День '+S.day+' — рынок обновился','#9cf')}
 if(mode=='farm'){S.tiles.forEach((tl,i)=>{const d=dt*S.spd;if(S.up.auto&&tl.ps.length&&tl.wet<.35)tl.aw=1.2;if(tl.aw>0){tl.aw-=dt;tl.wet=Math.min(1,tl.wet+dt*1.2);if(Math.random()<.6)parts.push({k:'w',x:FX+(i%CO)*T+rr(8,T-8),y:FY+((i/CO)|0)*T+rr(0,30),vx:0,vy:rr(60,120),l:.3,L:.3})}if(tl.wet>0)tl.ps.forEach(p=>p.age+=d);tl.wet=Math.max(0,tl.wet-d*(tl.ps.length?.02:.005))});tools().forEach(t=>t.h&&act(t,dt))}
 else{const CX=350,CY=480;if(cen.h){const a=Math.atan2(py-CY,px-CX),da=wrap(a-cen.pa);cen.pa=a;cen.w+=(da/Math.max(dt,.001)-cen.w)*.3;cen.ang+=da}else{cen.w*=Math.pow(.35,dt);cen.ang+=cen.w*dt}
  if(SLT[0]&&SLT[1]){cen.pr+=Math.abs(cen.w)*dt/(6*Math.PI);if(cen.pr>=1)cross()}else cen.pr=0}
 parts=parts.filter(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.k=='d')p.vy+=300*dt;p.l-=dt;
  if(p.l<=0&&p.k=='s'){const tl=p.tl;if(tl.ps.length<3&&!tl.ps.some(q=>sid(q.g)==sid(p.g)))tl.ps.push({g:mut(p.g,p.x,p.y),age:0});else addSeed(p.g,1)}return p.l>0});
 fls=fls.filter(f=>(f.t-=dt,f.y-=30*dt,f.t>0))}
const cen={ang:0,w:0,pr:0,h:0,pa:0},SX=[190,510],SY=[250,250];
function cross(){let[a,b]=SLT;cen.pr=0;if(Math.random()<.5)[a,b]=[b,a];let sp=a.sp,x=b.sp;
 if(sid(a)==sid(b)){x=a.x}else if(a.sp!=b.sp&&Math.random()<.1){sp=5;x=undefined}else if(a.sp==b.sp)x=b.x??a.x;if(x===sp)x=undefined;
 const av=(p,q)=>(p+q)/2,c={sp,x,h:av(a.h,b.h)+rr(-10,10),z:cl(av(a.z,b.z)+.05+rr(-.04,.04),.7,1.8),r:cl(av(a.r,b.r)+.05+rr(-.04,.04),.7,2),y:cl(av(a.y,b.y)+.2,1,4),m:[...new Set([...a.m,...b.m])].filter(()=>Math.random()<.75)};
 SLT=[null,null];addSeed(c,2);fl(350,400,(x!=null?'Новый гибрид: ':'Получено: ')+nm(c),'#9ff')}
function drop(t){const[tx,ty]=tipOf(t);for(let i=0;i<2;i++){const s=SLT[i];if(!s||Math.hypot(tx-SX[i],ty-SY[i])>75)continue;const cost=t.k=='vial'?15:10;
 if(S.coins<cost){fl(SX[i],SY[i]-70,'Не хватает монет','#f88');return}S.coins-=cost;
 if(t.k=='vial'){if(Math.random()<.7){const f=Object.keys(MU).filter(k=>!s.m.includes(k));if(f.length){const k=f[Math.random()*f.length|0];s.m.push(k);S.mu[k]=1;fl(SX[i],SY[i]-70,'Мутация: '+MU[k][0],'#9f9')}else fl(SX[i],SY[i]-70,'Все мутации уже есть','#ccc')}else{SLT[i]=null;fl(SX[i],SY[i]-70,'Образец погиб','#f88')}}
 else{s.z=Math.min(1.8,s.z+.07);s.r=Math.min(2,s.r+.07);s.y=Math.min(4,s.y+.25);fl(SX[i],SY[i]-70,'Улучшено','#8cf')}return}}
const colOf=(p,d)=>p.m.includes('gold')?'#ffcf33':p.m.includes('rain')?`hsl(${tm*90%360},90%,60%)`:`hsl(${d.h+p.h},${d.s}%,${d.l}%)`;
function fruit(c,d,R,col){const q=d.q;c.fillStyle=col;for(let i=0;i<q[0];i++){c.save();c.rotate(i*6.283/q[0]);c.beginPath();c.ellipse(R*q[1],0,R*q[2],R*q[3],0,0,7);c.fill();c.restore()}
 if(q[4]){c.fillStyle=d.cc||col;c.beginPath();c.arc(0,0,R*q[4],0,7);c.fill()}}
function plant(c,x,y,p,f,sc){const d=SP[p.sp],R=(5+19*f)*p.z*(p.m.includes('giant')?1.5:1)*sc;
 c.save();c.translate(x,y);c.fillStyle='#3f8f3c';for(let i=0;i<6;i++){c.save();c.rotate(i*1.05+.3);c.beginPath();c.ellipse(R*.55,0,R*.55,R*.26,0,0,7);c.fill();c.restore()}
 if(f<1){c.fillStyle='#6bbf55';c.beginPath();c.arc(0,0,R*.22,0,7);c.fill()}
 else{if(p.m.includes('glow')){c.shadowColor=colOf(p,d);c.shadowBlur=24}fruit(c,d,R,colOf(p,d));if(p.x!=null){c.shadowBlur=0;fruit(c,SP[p.x],R*.55,colOf(p,SP[p.x]))}
  if(p.m.includes('stripe')||p.sp==3){c.shadowBlur=0;c.strokeStyle='rgba(0,0,0,.28)';c.lineWidth=2;for(let i=0;i<4;i++){c.save();c.rotate(i*.8);c.beginPath();c.moveTo(-R*.7,0);c.lineTo(R*.7,0);c.stroke();c.restore()}}}
 c.restore()}
function drawFarm(){X.fillStyle='#2f4a26';X.fillRect(0,0,W,H);
 S.tiles.forEach((tl,i)=>{const ix=i%CO,iy=i/CO|0,x=FX+ix*T,y=FY+iy*T;X.fillStyle=(ix+iy)%2?'#5f9c47':'#5a9642';X.fillRect(x,y,T,T);
  if(tl.till>0){const m=4+(1-tl.till)*(T/2-4);X.fillStyle=`hsl(26,42%,${32-tl.wet*17}%)`;X.beginPath();X.roundRect(x+m,y+m,T-2*m,T-2*m,8);X.fill();if(tl.wet>0){X.fillStyle=`rgba(30,55,95,${tl.wet*.3})`;X.fill()}
   if(tl.till>=1){X.strokeStyle='rgba(0,0,0,.18)';X.lineWidth=2;for(let k=1;k<4;k++){X.beginPath();X.moveTo(x+8,y+k*T/4);X.lineTo(x+T-8,y+k*T/4);X.stroke()}}}
  if(tl.hole>0){X.fillStyle='#241508';X.beginPath();X.ellipse(x+T/2,y+T/2,22*tl.hole,15*tl.hole,0,0,7);X.fill()}

async function lbInit(){await lbLoad();setInterval(lbLoad,20000)}
async function lbSubmit(){if(!S.name)return;S.best=Math.max(S.best||0,S.earn);if(S.best===lbSent)return;const row={id:lbId,name:S.name.slice(0,16),score:S.best,day:S.day};
 const a=lbLocal().filter(r=>r.name!=row.name);a.push({name:row.name,score:row.score,day:row.day});a.sort((p,q)=>q.score-p.score);try{localStorage.setItem('farm2lb',JSON.stringify(a.slice(0,20)))}catch(e){}
 try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(row)});if(!r.ok)throw 0;lbSent=S.best;lbFail=0;lbLoad()}catch(e){lbFail=1;if(lbMode!='db'){LB=a.slice(0,20);lbDraw()}}}
bl.onclick=()=>{mb.innerHTML='<h2>🏆 Лидеры</h2><p>Очки — всего заработано монет (сохраняется лучший результат, сброс прогресса его не снижает).</p><div><input class="nm" maxlength="16" placeholder="Твоё имя" style="padding:7px;border-radius:8px;width:60%"> <button class="sv">Сохранить имя</button></div><p class="st"></p><table class="ls" style="width:100%;border-collapse:collapse"></table>'+cls;
 const ni=mb.querySelector('.nm'),st=mb.querySelector('.st'),ls=mb.querySelector('.ls');ni.value=S.name||'';
 st.textContent=lbMode=='db'?'Общий рейтинг (база данных на сервере).'+(lbFail?' Не удалось отправить результат, попробую снова.':''):'Сервер рейтинга недоступен — показан рейтинг этого устройства. Запусти игру через server.js.';
 const fill=()=>{ls.textContent='';if(!LB.length){ls.textContent='Пока никого — стань первым!';return}LB.forEach((r,i)=>{const tr=ls.insertRow(),me=S.name&&r.name==S.name;if(me)tr.style.background='rgba(224,176,74,.25)';[['🥇🥈🥉'.match(/./gu)[i]||i+1,''],[r.name,''],[r.score.toLocaleString('ru')+' 💰','right'],['день '+r.day,'right']].forEach(([v,al])=>{const td=tr.insertCell();td.textContent=v;td.style.padding='5px 8px';if(al)td.style.textAlign=al})})};
 fill();lbLoad(100).then(()=>{fill();st.textContent=lbMode=='db'?'Общий рейтинг (база данных на сервере).':st.textContent});
 mb.querySelector('.sv').onclick=()=>{const v=ni.value.trim().slice(0,16);if(v){S.name=v;save();lbSent=-1;lbSubmit();lbDraw()}};opn()};
function save(){try{localStorage.setItem('farm2',JSON.stringify(S))}catch(e){}}
setInterval(save,4000);document.addEventListener('visibilitychange',save);
let last=performance.now(),lc=-1;
function loop(n){const dt=Math.min(.05,(n-last)/1e3);last=n;tm+=dt;update(dt);draw();if(lc!==S.coins){lc=S.coins;co.textContent=S.coins}dy.textContent=S.day;db.style.width=(S.tod/DAY*100)+'%';requestAnimationFrame(loop)}
requestAnimationFrame(loop);lbInit();setInterval(lbSubmit,15000);
